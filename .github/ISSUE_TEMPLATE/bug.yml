name: Demo integration bug
description: Report a reproducible Inventory Desk or GyosJS/Laravel integration problem.
title: "[Bug]: "
body:
  - type: input
    id: route
    attributes:
      label: Route or journey step
      placeholder: /products/12/edit after boosted navigation
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I reproduced this in a fresh browser session.
          required: true
        - label: I did not enter private or sensitive data in the public demo.
          required: true
